seed: 42
data_path: data/data_prices.csv
data_type: prices
min_obs: 250
train_fraction: 0.75
corr_method: sample
n_random_starts: 20
n_eigenspace_starts: 10
kl_max_passes: 60
beam: {H: 5, K: 2, B: 3}
use_beam: true
library_target: 10
max_overlap: 0.6
K_range: [2, 3, 4, 5, 6]
cluster_method: hierarchical
n_global_pcs: 2
crossfit_iters: 3
mc_samples: 1000
cluster_null_samples: 50
k_selection:
  alpha: 1.0
  beta: 0.5
  gamma: 1.0

solver_method: kl
sb:
  enabled: false
  agents: 128
  mode: discrete
  heated: false
  lam_grid: [0.25, 0.5, 1.0, 2.0]
  repeats: 5
  use_as_library: false
extra_nulls: false
block_len: 21
diagnostics: false